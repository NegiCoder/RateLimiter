services:
  - type: web
    name: rate-limiter
    runtime: python
    plan: free
    branch: v2-redis
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RATE_LIMIT_CAPACITY
        value: "10"
      - key: RATE_LIMIT_REFILL_RATE
        value: "1"
      # Set REDIS_URL in the Render dashboard (from Upstash free tier).
